<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-label="Every question is classified and routed in code before any agent touches data" font-size="13">
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111827; }
    .q { fill: #6b7280; font-size: 11.5px; }
    .n { font-weight: 600; }
    .edge { stroke: #9ca3af; fill: none; stroke-width: 1.25; }
    .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.25; }
    .main { fill: #16a34a; fill-opacity: 0.1; stroke: #16a34a; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9ca3af"/>
    </marker>
  </defs>
  <text x="24" y="34" font-size="15" class="n">Every question is classified and routed in code before any agent touches data</text>
  <g class="edge">
    <path d="M380 100V122" marker-end="url(#arch-arrow)"/>
    <path d="M380 184V206" marker-end="url(#arch-arrow)"/>
    <path d="M380 268V292"/>
    <path d="M88 292H672"/>
    <path d="M88 292V314" marker-end="url(#arch-arrow)"/>
    <path d="M234 292V314" marker-end="url(#arch-arrow)"/>
    <path d="M380 292V314" marker-end="url(#arch-arrow)"/>
    <path d="M526 292V314" marker-end="url(#arch-arrow)"/>
    <path d="M672 292V314" marker-end="url(#arch-arrow)"/>
    <path d="M88 388V412H380V388"/>
    <path d="M234 412V434" marker-end="url(#arch-arrow)"/>
    <path d="M234 496V518" marker-end="url(#arch-arrow)"/>
    <path d="M526 388V542H356" marker-end="url(#arch-arrow)"/>
  </g>
  <rect class="box" x="260" y="56" width="240" height="44" rx="8"/>
  <text x="380" y="82" text-anchor="middle" class="n">User question</text>
  <rect class="box" x="180" y="124" width="400" height="60" rx="8"/>
  <text x="380" y="148" text-anchor="middle" class="n">Classifier</text>
  <text x="380" y="168" text-anchor="middle" class="q">intent, scope, entities, risk, confidence</text>
  <rect class="main" x="180" y="208" width="400" height="60" rx="8"/>
  <text x="380" y="232" text-anchor="middle" class="n">Router (deterministic code)</text>
  <text x="380" y="252" text-anchor="middle" font-size="11.5">picks the handler, its filters and permissions</text>
  <rect class="box" x="24" y="316" width="128" height="72" rx="8"/>
  <text x="88" y="340" text-anchor="middle" class="n">Policy expert</text>
  <text x="88" y="358" text-anchor="middle" class="q">RAG search over</text>
  <text x="88" y="374" text-anchor="middle" class="q">policy wordings</text>
  <rect class="box" x="170" y="316" width="128" height="72" rx="8"/>
  <text x="234" y="340" text-anchor="middle" class="n">Claims agent</text>
  <text x="234" y="358" text-anchor="middle" class="q">SQL on read-only</text>
  <text x="234" y="374" text-anchor="middle" class="q">claims views</text>
  <rect class="box" x="316" y="316" width="128" height="72" rx="8"/>
  <text x="380" y="340" text-anchor="middle" class="n">Analyst</text>
  <text x="380" y="358" text-anchor="middle" class="q">sandboxed shell:</text>
  <text x="380" y="374" text-anchor="middle" class="q">grep, jq, Python</text>
  <rect class="box" x="462" y="316" width="128" height="72" rx="8"/>
  <text x="526" y="340" text-anchor="middle" class="n">Out of scope</text>
  <text x="526" y="358" text-anchor="middle" class="q">explain the remit,</text>
  <text x="526" y="374" text-anchor="middle" class="q">point elsewhere</text>
  <rect class="box" x="608" y="316" width="128" height="72" rx="8"/>
  <text x="672" y="340" text-anchor="middle" class="n">Human handoff</text>
  <text x="672" y="358" text-anchor="middle" class="q">high risk or</text>
  <text x="672" y="374" text-anchor="middle" class="q">low confidence</text>
  <rect class="box" x="114" y="436" width="240" height="60" rx="8"/>
  <text x="234" y="460" text-anchor="middle" class="n">Verifier</text>
  <text x="234" y="480" text-anchor="middle" class="q">every claim backed by evidence</text>
  <rect class="box" x="114" y="520" width="240" height="44" rx="8"/>
  <text x="234" y="546" text-anchor="middle" class="n">Answer with citations</text>
  <text x="372" y="462" class="q">specialists see only</text>
  <text x="372" y="478" class="q">their own tools</text>
  <text x="520" y="534" text-anchor="end" class="q">brief reply</text>
</svg>
